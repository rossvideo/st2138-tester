services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: test-your-catena:local
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1536m
    cpus: 2
    restart: unless-stopped
